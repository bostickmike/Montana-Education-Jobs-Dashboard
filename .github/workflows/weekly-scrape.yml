name: Weekly job data refresh

# The steps are edjobs's reusable workflow (.github/workflows/weekly-run.yml, package review step 6, 2026-11-20); this
# file keeps what is Montana's: when it runs, its files, and its secrets. The R code each step runs is still this
# repo's .github/scripts (most of them call edjobs). The workflow's tag is EDJOBS_VERSION's (bump both together;
# tests/testthat/test-weekly-workflow-ref.R), and the steps install the package at EDJOBS_VERSION.
on:
  schedule:
    # Mondays and Thursdays 07:17 UTC: just after midnight Mountain (00:17 MST, 01:17 MDT), so a
    # run counts for the right Mountain day however late GitHub starts it, and with the
    # 4-9.5 h delays seen so far it is usually done by mid-morning, leaving the day to fix and re-run a
    # failure (Mike, 2026-11-19; 13:00 UTC before, which started 17:00-21:30 UTC).
    # Twice a week since 2026-11-17 (Tuesdays before). Never on Wyoming's days (Tuesdays and
    # Fridays): the two projects share one CENSUS_API_KEY, and different
    # days keep both pipelines' Census ACS/SAIPE calls apart (user request,
    # 2026-08-06; days chosen 2026-11-13).
    - cron: '17 7 * * 1,4'
  workflow_dispatch: {}

# One weekly run at a time: on 2026-11-03 a scheduled run that GitHub started
# ~7 hours late overlapped a manual run. A second run waits for the first.
concurrency:
  group: weekly-scrape
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # file_autofix_issues.R dispatches claude-autofix.yml per new issue.
  actions: write

jobs:
  weekly:
    uses: bostickmike/edjobs/.github/workflows/weekly-run.yml@v0.98.0
    with:
      app_dir: Mt_Ed_Jobs
      rmd: Mt_ED_Jobs.Rmd
      # One run date for every step, in the boards' own time zone (2026-11-17).
      timezone: America/Denver
      extra_packages: tibble
      # llm_extract_scraper.R's SHADOW pilot asks Gemini during the pipeline (a no-op without the key).
      pipeline_gemini: true
      # OPI vs. our scrapes: districts where OPI lists jobs our scrape didn't find, scrapes that came back empty, and
      # districts we don't scrape that posted on OPI.
      # Then boards whose postings haven't changed in weeks (WY's check, 2026-11-22).
      state_checks: |
        .github/scripts/check_opi_crosscheck.R
        .github/scripts/check_frozen_boards.R
      state_files: |
        Mt_Ed_Jobs/opi_district_counties.csv
        Mt_Ed_Jobs/mt_district_crosswalk.csv
        Mt_Ed_Jobs/opi_only_districts.csv
      # The SHADOW-pilot review file exists once the pilot has produced a posting.
      optional_files: |
        Mt_Ed_Jobs/llm_extract_shadow.csv
      autofix_engine: ${{ vars.AUTOFIX_ENGINE }}
    secrets:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
